name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# changesets/action needs to push the release tag, create the GitHub release and
# open the Release PR. With a read-only GITHUB_TOKEN the publish step still ran
# (NPM_TOKEN is separate) but tagging silently failed — 0.5.5 reached npm with no
# tag or release, which is what this block fixes.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'simsustech/unocss-preset-quasar'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Packages
        run: pnpm run build

      # v2 renamed the inputs: publish -> publish-script, commit ->
      # commit-message, title -> pr-title. Tagging and the GitHub release are on
      # by default (push-git-tags, create-github-releases).
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run publish
          commit-message: 'chore: release package(s)'
          pr-title: 'chore: release package(s)'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
