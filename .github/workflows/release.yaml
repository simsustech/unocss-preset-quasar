name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# changesets/action needs to push the release tag, create the GitHub release and
# open the Release PR. With a read-only GITHUB_TOKEN the publish step still ran
# (NPM_TOKEN is separate) but tagging silently failed, so 0.5.5 reached npm
# untagged and unreleased, which is what this block fixes.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'simsustech/unocss-preset-quasar'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Packages
        run: pnpm run build

      # pnpm does NOT read the NPM_TOKEN env var — it only reads a
      # `//registry.npmjs.org/:_authToken=` line from .npmrc. changesets/action
      # (neither v1 nor v2) writes one. Without this step `changeset publish`
      # runs `pnpm publish` unauthenticated and npm answers the PUT to the
      # already-published package with `404 {"error":"Not found"}` — exactly
      # what the failed 0.6.0 release hit.
      - name: Configure npm auth
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is empty or missing"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # v2 renamed the inputs: publish -> publish-script, commit ->
      # commit-message, title -> pr-title. Tagging and the GitHub release are on
      # by default (push-git-tags, create-github-releases).
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run publish
          commit-message: 'chore: release package(s)'
          pr-title: 'chore: release package(s)'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Kept for compatibility; the auth that actually reaches pnpm is the
          # .npmrc written by "Configure npm auth" above.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
